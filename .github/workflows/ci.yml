name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  # Until backend/uv.lock is committed, dependencies are resolved from the
  # ranges in pyproject.toml. Once the lockfile exists, CI installs it as-is.
  UV_LOCK_HINT: "backend/uv.lock is missing: dependencies resolved from pyproject.toml ranges"

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else echo "::warning::$UV_LOCK_HINT"; uv sync; fi
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  backend-types:
    name: backend-types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else echo "::warning::$UV_LOCK_HINT"; uv sync; fi
      - name: mypy (strict)
        run: uv run mypy

  backend-test:
    name: backend-test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: specula
          POSTGRES_PASSWORD: specula-ci
          POSTGRES_DB: specula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specula -d specula_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests (tests/db) run against this service; in CI they must not be skipped.
      TEST_DATABASE_URL: postgresql+asyncpg://specula:specula-ci@127.0.0.1:5432/specula_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else echo "::warning::$UV_LOCK_HINT"; uv sync; fi
      - name: pytest
        run: uv run pytest --cov=app --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  images:
    name: images
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    env:
      # Dummy values: only used to render and validate the configuration.
      POSTGRES_PASSWORD: ci-not-a-secret
      BACKUP_AGE_RECIPIENT: age1ci0000000000000000000000000000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Test proxy TLS and LAN-only rule
        run: |
          set -euo pipefail
          docker network create ci-proxy
          # Stub upstream answering as api:8000, so allowed requests reach a backend.
          docker run -d --name ci-api --network ci-proxy --network-alias api \
            python:3.12-slim python -m http.server 8000 > /dev/null
          # The client connects by IP and sends no SNI (covers default_sni).
          status() {
            curl -sk --resolve 10.128.4.106:8443:127.0.0.1 -o /dev/null -w '%{http_code}' \
              "https://10.128.4.106:8443$1"
          }
          start_proxy() {
            docker rm -f ci-caddy > /dev/null 2>&1 || true
            docker run -d --name ci-caddy --network ci-proxy -p 127.0.0.1:8443:443 \
              -e SPECULA_HOST=10.128.4.106 -e SPECULA_ALLOWED_NETWORKS="$1" \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 > /dev/null
            for _ in $(seq 30); do
              [ "$(status /)" != "000" ] && return 0
              sleep 1
            done
            docker logs ci-caddy
            return 1
          }
          # Requests reach Caddy from the Docker gateway, outside 10.128.4.0/24: must be refused.
          start_proxy "10.128.4.0/24"
          for path in / /api/v1/health; do
            got="$(status "$path")"
            [ "$got" = "403" ] || { echo "expected 403 for $path from outside the LAN, got $got"; exit 1; }
          done
          # Allowed source: the request must pass the rule.
          start_proxy "0.0.0.0/0"
          [ "$(status /)" = "200" ] || { echo "expected 200 for / from an allowed network"; exit 1; }
          [ "$(status /api/v1/health)" != "403" ] || { echo "allowed request was refused"; exit 1; }
          echo "proxy rule OK"
      - name: Clean up proxy test
        if: always()
        run: docker rm -f ci-caddy ci-api > /dev/null 2>&1 || true

      - name: Lint backup scripts
        run: shellcheck deploy/backup/*.sh
      - name: Build backup image
        run: docker build -t specula-backup:local deploy/backup
      - name: Test backup and restore
        run: |
          set -euo pipefail
          docker network create specula_data
          docker run -d --name db --network specula_data \
            -e POSTGRES_USER=specula -e POSTGRES_PASSWORD=ci-pass -e POSTGRES_DB=specula postgres:16 > /dev/null
          for _ in $(seq 60); do docker exec db pg_isready -U specula -d specula > /dev/null 2>&1 && break; sleep 1; done
          docker exec db psql -U specula -d specula -q -c \
            "create table alembic_version (version_num varchar(32) primary key); insert into alembic_version values ('0001');
             create table probe (id int); insert into probe select generate_series(1, 100);"

          keys="$(docker run --rm specula-backup:local age-keygen 2> /dev/null)"
          recipient="$(printf '%s\n' "$keys" | sed -n 's/^# public key: //p')"
          backups="$(mktemp -d)"
          run_backup() {
            docker run --rm --network specula_data -v "$backups:/backups" \
              -e PGHOST=db -e PGUSER=specula -e PGPASSWORD=ci-pass -e PGDATABASE=specula \
              -e BACKUP_AGE_RECIPIENT="$recipient" specula-backup:local backup.sh now
          }
          restore_test() {
            docker run --rm -i --network specula_data --tmpfs /tmp:rw,size=512m -v "$backups:/backups:ro" \
              -e LIVE_PGHOST=db -e LIVE_PGUSER=specula -e LIVE_PGDATABASE=specula -e LIVE_PGPASSWORD=ci-pass \
              specula-backup:local restore-test.sh latest
          }

          echo "--- without the disk marker the backup must refuse to write"
          if run_backup; then echo "backup ran without the marker"; exit 1; fi
          [ -z "$(ls -A "$backups")" ] || { echo "files written without the marker"; exit 1; }

          echo "--- with the marker: encrypted dump, checksum, status"
          touch "$backups/.specula-backup-disk"
          run_backup
          dump="$(find "$backups" -name 'specula-*.dump.age' | head -n 1)"
          if [ -z "$dump" ] || [ ! -f "$dump.sha256" ] || [ ! -f "$backups/last-backup.json" ]; then
            echo "dump, checksum or status file missing"; exit 1
          fi
          if head -c 5 "$dump" | grep -q PGDMP; then echo "dump is not encrypted"; exit 1; fi
          grep -q '"outcome": "success"' "$backups/last-backup.json"

          echo "--- restore with the right key"
          out="$(printf '%s\n' "$keys" | restore_test)"
          echo "$out"
          grep -q '^RESULT: OK' <<< "$out"

          echo "--- restore with a wrong key must fail"
          wrong="$(docker run --rm specula-backup:local age-keygen 2> /dev/null)"
          if printf '%s\n' "$wrong" | restore_test; then echo "restore succeeded with a wrong key"; exit 1; fi
          echo "backup and restore OK"
      - name: Clean up backup test
        if: always()
        run: docker rm -f db > /dev/null 2>&1 || true

      - name: Build backend image
        run: docker build -f deploy/Dockerfile.backend -t specula-backend:ci .
      - name: Smoke test backend image
        run: |
          docker run --rm -e DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:1/db specula-backend:ci \
            python -c "from app.main import create_app; create_app(); print('app ok')"
          docker run --rm specula-backend:ci alembic --help > /dev/null && echo "alembic ok"
