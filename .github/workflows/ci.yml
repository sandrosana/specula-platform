name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  # Until backend/uv.lock is committed, dependencies are resolved from the
  # ranges in pyproject.toml. Once the lockfile exists, CI installs it as-is.
  UV_LOCK_HINT: "backend/uv.lock is missing: dependencies resolved from pyproject.toml ranges"

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else echo "::warning::$UV_LOCK_HINT"; uv sync; fi
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  backend-types:
    name: backend-types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else echo "::warning::$UV_LOCK_HINT"; uv sync; fi
      - name: mypy (strict)
        run: uv run mypy

  backend-test:
    name: backend-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else echo "::warning::$UV_LOCK_HINT"; uv sync; fi
      - name: pytest
        run: uv run pytest --cov=app --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
