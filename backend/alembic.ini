# Alembic configuration for Specula Threat.
# The database URL is not stored here: migrations/env.py reads it from
# app.core.config (DATABASE_URL), unless a caller sets sqlalchemy.url.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
