[project]
name = "specula-threat"
version = "0.1.0"
description = "Specula Threat – Threat Intelligence module of the Specula platform"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sandro Sana", email = "sandro@sanasandro.it" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.29,<1",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "pytest-socket>=0.7,<1",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "N",        # naming
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest works
    "S105",  # tests use fake credentials
    "S106",
]
"migrations/versions/*" = ["N999"]  # revision files start with the revision number

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
# Revision files are named <rev>_<slug>.py, which is not a valid module name for mypy.
files = ["app", "tests", "migrations/env.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type hints.
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must never reach external sources: real network access is blocked.
# Database tests (tests/db) re-enable sockets for 127.0.0.1 only.
addopts = "--strict-markers --disable-socket --allow-unix-socket"
